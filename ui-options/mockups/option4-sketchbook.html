<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Option 4 Refined Sketchbook</title>
<style>
@font-face { font-family: 'Caveat Brush'; src: url(../fonts/caveat-brush-latin-400-normal.woff2); }
@font-face { font-family: 'Nunito'; font-weight: 400; src: url(../fonts/nunito-latin-400-normal.woff2); }
@font-face { font-family: 'Nunito'; font-weight: 700; src: url(../fonts/nunito-latin-700-normal.woff2); }
:root {
  /* Design tokens: Refined Sketchbook */
  --paper: #fbf8f0; --paper2: #f4efe2; --ink: #1f1d1a; --pencil: #8a857c; --blue: #2f55c8; --red: #d9342b; --hl: #ffe55c; --mint: #2e9e6b;
  --display: 'Caveat Brush', cursive; --body: 'Nunito', system-ui, sans-serif;
  --sk: 255px 15px 225px 15px / 15px 225px 15px 255px;  /* the one hand-drawn corner style, used everywhere */
  --sk2: 15px 225px 15px 255px / 255px 15px 225px 15px;
  --s1: calc(var(--u) * 8px); --s2: calc(var(--u) * 16px); --s3: calc(var(--u) * 24px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
#stage { position: relative; overflow: hidden; background-size: cover; background-position: center; font-family: var(--body); color: var(--ink); }
.ico { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.disp { font-family: var(--display); letter-spacing: .01em; }
.lbl { font-weight: 700; font-size: calc(var(--u) * 12px); letter-spacing: .08em; text-transform: uppercase; color: var(--pencil); }
.card { position: absolute; background: var(--paper); border: calc(var(--u) * 2.5px) solid var(--ink); border-radius: var(--sk); box-shadow: calc(var(--u) * 4px) calc(var(--u) * 5px) 0 rgba(31,29,26,.14); }
.card.tape::before { content: ''; position: absolute; top: calc(var(--u) * -12px); left: 50%; width: calc(var(--u) * 90px); height: calc(var(--u) * 24px); margin-left: calc(var(--u) * -45px); background: rgba(255,229,92,.55); transform: rotate(-3deg); }
.pill { position: relative; height: calc(var(--u) * 18px); border: calc(var(--u) * 2.5px) solid var(--ink); border-radius: var(--sk); background: var(--paper); overflow: hidden; }
.pill i { position: absolute; left: 0; top: 0; bottom: 0; }
.hatch { background: repeating-linear-gradient(-55deg, var(--c, var(--ink)) 0 calc(var(--u) * 2px), transparent calc(var(--u) * 2px) calc(var(--u) * 6px)); }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); min-width: calc(var(--u) * 230px); height: calc(var(--u) * 54px); padding: 0 var(--s3);
  background: var(--paper); border: calc(var(--u) * 2.5px) solid var(--ink); border-radius: var(--sk); font-family: var(--display); font-size: calc(var(--u) * 26px); color: var(--ink); box-shadow: calc(var(--u) * 3px) calc(var(--u) * 4px) 0 rgba(31,29,26,.18); }
.btn.primary { background: linear-gradient(transparent 22%, var(--hl) 22% 82%, transparent 82%), var(--paper); color: var(--red); border-color: var(--red); }
.btn.hover { transform: rotate(-1.2deg) translateY(calc(var(--u) * -2px)); box-shadow: calc(var(--u) * 5px) calc(var(--u) * 7px) 0 rgba(31,29,26,.2); background: linear-gradient(transparent 60%, rgba(255,229,92,.7) 60% 86%, transparent 86%), var(--paper); }
.btn.pressed { transform: translateY(calc(var(--u) * 3px)); box-shadow: 0 0 0 rgba(0,0,0,0); background: var(--paper2); }
.btn.disabled { color: #b9b4aa; border-color: #c9c4ba; box-shadow: none; border-style: dashed; }
.row { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--u) * 9px) 0; border-bottom: calc(var(--u) * 1.5px) dashed rgba(31,29,26,.22); font-size: calc(var(--u) * 16px); }
.cb { width: calc(var(--u) * 24px); height: calc(var(--u) * 24px); border: calc(var(--u) * 2.5px) solid var(--ink); border-radius: 4px 7px 3px 6px; position: relative; transform: rotate(-2deg); }
.cb.on::after { content: '✓'; position: absolute; left: calc(var(--u) * 2px); top: calc(var(--u) * -8px); font-family: var(--display); font-size: calc(var(--u) * 30px); color: var(--red); }
.track { width: calc(var(--u) * 150px); height: calc(var(--u) * 3px); background: var(--ink); border-radius: 2px; position: relative; transform: rotate(-.5deg); }
.track b { position: absolute; top: 50%; width: calc(var(--u) * 18px); height: calc(var(--u) * 16px); margin: calc(var(--u) * -8px) 0 0 calc(var(--u) * -9px); background: var(--paper); border: calc(var(--u) * 2.5px) solid var(--ink); border-radius: 48% 52% 45% 55%; }
.padline { position: absolute; left: 0; right: 0; top: 50%; border-top: calc(var(--u) * 1.5px) dashed rgba(138,133,124,.45); }
.padtag { position: absolute; left: calc(var(--u) * 14px); top: calc(50% + 4px); font-family: var(--display); font-size: calc(var(--u) * 15px); color: rgba(138,133,124,.8); }
.ann { position: absolute; font-family: var(--display); color: var(--red); }
.hl { background: linear-gradient(transparent 40%, var(--hl) 40% 88%, transparent 88%); padding: 0 calc(var(--u) * 4px); }
</style></head>
<body><div id="stage"></div>
<script src="data.js"></script>
<script>
const G = GAME, W = DEV.w, H = DEV.h;
const u = DEVICE === 'phone' ? 0.7 : 1;
const st = document.getElementById('stage');
st.style.cssText += `width:${W}px;height:${H}px;--u:${u};background-image:url(${bgFor(SCREEN)})`;
const add = (h) => st.insertAdjacentHTML('beforeend', h);
const pct = (v) => (v * 100).toFixed(1) + '%';

function specialPill(state, f, w = 300) {
  const ready = state === 'ready', act = state === 'active';
  return `<div style="width:${w * u}px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl" style="color:var(--ink)">${icon('bolt')} Special</span>
    <span class="disp" style="font-size:${18 * u}px;color:${ready ? 'var(--red)' : act ? 'var(--blue)' : 'var(--pencil)'}">${ready ? '<span class="hl">ready — hold!</span>' : act ? 'unleashed!' : Math.round(f * 100) + '%'}</span></div>
    <div class="pill" style="margin-top:${4 * u}px;${ready ? 'border-color:var(--red);box-shadow:0 0 0 ' + 3 * u + 'px rgba(255,229,92,.8)' : ''}"><i class="hatch" style="width:${pct(f)};--c:${act ? 'var(--blue)' : ready ? 'var(--red)' : 'var(--pencil)'}"></i></div></div>`;
}
function hud() {
  add(`<div class="padline"></div><div class="padtag">touch area — kept clear</div>`);
  add(`<div class="card" style="left:${18 * u}px;top:${14 * u}px;padding:${10 * u}px ${14 * u}px;width:${340 * u}px">
    <div style="display:flex;align-items:center;gap:${8 * u}px"><span style="color:var(--red);font-size:${22 * u}px">${icon('heart')}</span><div class="pill" style="flex:1"><i style="width:${pct(G.hp / G.maxHp)};background:var(--blue)"></i></div><span style="font-weight:700;font-size:${15 * u}px">${G.hp}</span></div>
    <div style="margin-top:${8 * u}px">${specialPill('ready', 1, 310)}</div>
    <div style="margin-top:${6 * u}px;display:flex;align-items:center;gap:${6 * u}px;font-size:${14 * u}px;font-weight:700">${icon('fists')} Fists</div></div>`);
  add(`<div style="position:absolute;left:50%;top:${12 * u}px;transform:translateX(-50%);text-align:center"><div class="lbl">wave ${G.wave}</div><div class="disp" style="font-size:${40 * u}px;line-height:1">${G.score.toLocaleString()}</div></div>`);
  add(`<div class="card" style="right:${18 * u}px;top:${14 * u}px;width:${48 * u}px;height:${48 * u}px;display:flex;align-items:center;justify-content:center;font-size:${22 * u}px">${icon('pause')}</div>`);
  add(`<div style="position:absolute;right:${26 * u}px;top:${78 * u}px;text-align:right"><span class="disp" style="font-size:${72 * u}px;line-height:.9">${G.combo}</span>
    <span class="disp" style="display:inline-block;margin-left:${8 * u}px;width:${58 * u}px;height:${58 * u}px;border:${3 * u}px solid var(--red);border-radius:52% 48% 55% 45%;text-align:center;line-height:${52 * u}px;font-size:${40 * u}px;color:var(--red);transform:rotate(-6deg)">${G.rank}</span>
    <div style="font-weight:700;font-size:${14 * u}px">hit combo · <span style="color:var(--pencil)">dmg ${G.dmgScale}%</span></div>
    <div class="pill" style="height:${8 * u}px;width:${120 * u}px;margin:${4 * u}px 0 0 auto;border-width:${2 * u}px"><i style="width:${pct(G.rankFill)};background:var(--red)"></i></div></div>`);
  // rhythm: groove + beat ticks drawn as a ruler
  add(`<div style="position:absolute;left:50%;top:${66 * u}px;transform:translateX(-50%);width:${300 * u}px">
    <div style="position:relative;height:${18 * u}px;border-bottom:${2 * u}px solid var(--ink)">${G.beatsAhead.map((b) => `<i style="position:absolute;bottom:0;left:${50 + b * 46}%;width:${2.5 * u}px;height:${10 * u}px;background:var(--ink)"></i><i style="position:absolute;bottom:0;left:${50 - b * 46}%;width:${2.5 * u}px;height:${10 * u}px;background:var(--ink)"></i>`).join('')}<i style="position:absolute;bottom:${-6 * u}px;left:50%;width:${12 * u}px;height:${24 * u}px;margin-left:${-6 * u}px;border:${2.5 * u}px solid var(--red);border-radius:40%"></i></div>
    <div style="display:flex;align-items:center;gap:${6 * u}px;margin-top:${6 * u}px"><span class="lbl">groove</span><div class="pill" style="flex:1;height:${9 * u}px;border-width:${2 * u}px"><i style="width:${pct(G.groove)};background:var(--mint)"></i></div></div></div>`);
  G.damage.forEach((d) => add(`<div class="disp" style="position:absolute;left:${d.x * W}px;top:${d.y * H}px;transform:translate(-50%,-50%) rotate(-6deg);font-size:${(d.crit ? 34 : 24) * u}px;color:${d.crit ? 'var(--red)' : 'var(--ink)'}">${d.v}${d.crit ? '!' : ''}</div>`));
  add(`<div class="disp" style="position:absolute;left:${0.6 * W}px;top:${0.38 * H}px;transform:translate(-50%,-50%) rotate(-4deg);font-size:${34 * u}px;color:var(--blue)"><span class="hl">perfect!</span></div>`);
}
function special(qte) {
  add(`<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(251,248,240,.2),rgba(31,29,26,.55))"></div>`);
  add(`<div class="card" style="left:${18 * u}px;top:${14 * u}px;padding:${10 * u}px ${14 * u}px">${specialPill('active', 1, 260)}</div>`);
  add(`<div class="card tape" style="left:50%;top:${H * 0.08}px;transform:translateX(-50%) rotate(-1.5deg);padding:${6 * u}px ${26 * u}px"><div class="disp" style="font-size:${40 * u}px;color:var(--red)">Mega Jumpshot!</div></div>`);
  const pts = tracePath(W, H);
  if (!qte) {
    add(`<svg style="position:absolute;inset:0" width="${W}" height="${H}">
      <path d="${pathD(pts)}" fill="none" stroke="#fbf8f0" stroke-width="${20 * u}" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
      <path d="${pathD(pts)}" fill="none" stroke="#1f1d1a" stroke-width="${6 * u}" stroke-dasharray="${1 * u} ${13 * u}" stroke-linecap="round"/>
      <path d="${pathD(pts, G.trace.progress)}" fill="none" stroke="#ffe55c" stroke-width="${18 * u}" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      <path d="${pathD(pts, G.trace.progress)}" fill="none" stroke="#d9342b" stroke-width="${6 * u}" stroke-linecap="round" stroke-linejoin="round"/>
      ${[0.25, 0.5, 0.72, 0.92].map((k) => { const i = Math.floor(pts.length * k), a = pts[i], b = pts[Math.min(pts.length - 1, i + 2)]; const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI; return `<path d="M${-10 * u} ${-9 * u} L${2 * u} 0 L${-10 * u} ${9 * u}" transform="translate(${a[0]},${a[1]}) rotate(${ang})" fill="none" stroke="#1f1d1a" stroke-width="${3 * u}" stroke-linecap="round"/>`; }).join('')}
      <circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="${13 * u}" fill="#d9342b" stroke="#1f1d1a" stroke-width="${3 * u}"/></svg>`);
    const R = 30 * u;
    add(`<div class="card" style="left:50%;top:${H * 0.26}px;transform:translateX(-50%);padding:${8 * u}px ${18 * u}px;display:flex;align-items:center;gap:${12 * u}px">
      <svg width="${2 * R + 8}" height="${2 * R + 8}"><circle cx="${R + 4}" cy="${R + 4}" r="${R}" fill="none" stroke="#e6e0d2" stroke-width="${7 * u}"/><circle cx="${R + 4}" cy="${R + 4}" r="${R}" fill="none" stroke="#1f1d1a" stroke-width="${7 * u}" stroke-dasharray="${2 * Math.PI * R * G.trace.fuse} 999" transform="rotate(-90 ${R + 4} ${R + 4})"/><text x="${R + 4}" y="${R + 12}" text-anchor="middle" font-family="Caveat Brush" font-size="${22 * u}" fill="#1f1d1a">1.2</text></svg>
      <div><div class="disp" style="font-size:${26 * u}px">Trace the path!</div><div class="lbl">keys ${G.trace.keys}</div></div></div>`);
  } else {
    const cx = W / 2, cy = H * 0.7, R0 = 50 * u, R = R0 + G.qte.ring * 100 * u;
    add(`<svg style="position:absolute;inset:0" width="${W}" height="${H}"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#2f55c8" stroke-width="${3 * u}" stroke-dasharray="${10 * u} ${6 * u}"/>
      <circle cx="${cx}" cy="${cy}" r="${R0}" fill="#fbf8f0" stroke="#1f1d1a" stroke-width="${3 * u}"/><circle cx="${cx}" cy="${cy}" r="${R0 - 7 * u}" fill="none" stroke="#ffe55c" stroke-width="${8 * u}"/>
      <text x="${cx}" y="${cy + 20 * u}" text-anchor="middle" font-family="Caveat Brush" font-size="${64 * u}" fill="#d9342b">${G.qte.glyph}</text></svg>`);
    add(`<div class="card" style="left:50%;top:${cy + R0 + 14 * u}px;transform:translateX(-50%);padding:${2 * u}px ${14 * u}px"><span class="disp" style="font-size:${20 * u}px">swipe up · ${G.qte.index + 1} of ${G.qte.count}</span></div>`);
    add(`<div class="disp" style="position:absolute;left:0;right:0;top:${H * 0.38}px;text-align:center;font-size:${48 * u}px;color:var(--blue)"><span class="hl" style="background:linear-gradient(transparent 40%,#ffe55c 40% 88%,transparent 88%)">perfect!</span></div>`);
  }
}
function title() {
  add(`<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,248,240,.55),rgba(251,248,240,0) 60%)"></div>`);
  add(`<div style="position:absolute;left:0;right:0;top:${H * 0.08}px;text-align:center"><div class="disp" style="display:inline-block;font-size:${132 * u}px;line-height:1;transform:rotate(-3deg);text-shadow:${5 * u}px ${5 * u}px 0 var(--red)">JumpShot</div>
    <div style="font-size:${16 * u}px;font-weight:700;letter-spacing:.3em;color:var(--pencil);margin-top:${4 * u}px">SWIPE · LAUNCH · JUGGLE · SPIKE</div></div>`);
  add(`<div style="position:absolute;left:50%;top:${H * 0.46}px;transform:translateX(-50%);display:flex;gap:${24 * u}px;font-family:var(--display);font-size:${24 * u}px">
    <span style="display:flex;align-items:center;gap:${8 * u}px"><span class="cb on"></span><span class="hl">Rhythm mode</span></span><span style="display:flex;align-items:center;gap:${8 * u}px"><span class="cb"></span>Classic mode</span></div>`);
  add(`<div style="position:absolute;left:0;right:0;top:${H * 0.58}px;display:flex;justify-content:center;gap:${16 * u}px"><div class="btn primary" style="min-width:${200 * u}px">Fight!</div><div class="btn">${icon('fists')} Weapon: Fists</div><div class="btn" style="min-width:${170 * u}px">${icon('gear')} Settings</div></div>`);
  add(`<div class="card tape" style="right:${24 * u}px;top:${22 * u}px;padding:${6 * u}px ${16 * u}px;transform:rotate(2deg)"><div class="lbl">best</div><div class="disp" style="font-size:${28 * u}px;line-height:1">${G.best.toLocaleString()}</div><div class="lbl">wave ${G.bestWave}</div></div>`);
  add(`<div class="disp" style="position:absolute;left:0;right:0;bottom:${16 * u}px;text-align:center;font-size:${24 * u}px"><span class="hl">tap or flick the lower half to start</span></div>`);
}
function loadout() {
  add(`<div style="position:absolute;inset:0;background:rgba(251,248,240,.86)"></div>`);
  const sel = G.weapons[0];
  add(`<div class="disp" style="position:absolute;left:${28 * u}px;top:${12 * u}px;font-size:${44 * u}px">Loadout <span style="font-size:${22 * u}px;color:var(--pencil)">— pick one weapon</span></div>`);
  add(`<div class="card tape" style="left:${24 * u}px;top:${84 * u}px;width:${W * 0.34}px;bottom:${84 * u}px;padding:${14 * u}px ${18 * u}px">
    <div class="disp" style="font-size:${32 * u}px">${icon('fists')} ${sel.name}</div><div style="font-size:${14 * u}px;margin:${4 * u}px 0 ${8 * u}px">${sel.desc}</div>
    <div style="height:${H * 0.17}px;border:${2 * u}px solid var(--ink);border-radius:var(--sk2);background:url(${bgFor('title')}) center 72%/230% no-repeat"></div>
    <div style="margin-top:${6 * u}px">${[['→', 'side'], ['↗', 'upDiag'], ['↑', 'up'], ['↘', 'downDiag'], ['↓', 'down']].map(([g, k]) => `<div class="row" style="padding:${4 * u}px 0;font-size:${14 * u}px"><span class="disp" style="width:${24 * u}px;color:var(--red);font-size:${18 * u}px">${g}</span><span style="flex:1">${sel.moves[k][0]}</span><span style="color:var(--pencil)">${sel.moves[k][1]}</span></div>`).join('')}</div></div>`);
  add(`<div style="position:absolute;left:${W * 0.34 + 54 * u}px;right:${24 * u}px;top:${90 * u}px;bottom:${92 * u}px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:${10 * u}px">
    ${G.weapons.map((w, i) => `<div style="position:relative;border:${2.5 * u}px solid ${i === 0 ? 'var(--red)' : 'var(--ink)'};border-radius:${i % 2 ? 'var(--sk2)' : 'var(--sk)'};background:${i === 0 ? 'linear-gradient(transparent 55%,rgba(255,229,92,.8) 55% 85%,transparent 85%),var(--paper)' : 'var(--paper)'};display:flex;flex-direction:column;align-items:center;justify-content:center;padding:${4 * u}px">
      <span style="position:absolute;left:${6 * u}px;top:${2 * u}px;font-family:var(--display);font-size:${15 * u}px;color:var(--pencil)">${i < 10 ? (i + 1) % 10 : ''}</span><span style="font-size:${30 * u}px">${icon(w.id)}</span><span style="font-size:${11 * u}px;font-weight:700;text-align:center;line-height:1.1;margin-top:${4 * u}px">${w.name}</span></div>`).join('')}</div>`);
  add(`<div style="position:absolute;right:${24 * u}px;bottom:${18 * u}px;display:flex;align-items:center;gap:${14 * u}px"><span class="lbl">1–9 · 0 · Q / E</span><div class="btn primary">Done</div></div>`);
}
function pause() {
  add(`<div style="position:absolute;inset:0;background:rgba(251,248,240,.78)"></div>`);
  add(`<div class="card tape" style="left:${W * 0.07}px;top:${H * 0.12}px;width:${W * 0.32}px;padding:${18 * u}px;display:flex;flex-direction:column;gap:${12 * u}px;align-items:stretch">
    <div class="disp" style="font-size:${44 * u}px;text-align:center;transform:rotate(-2deg)">Paused</div>
    <div class="btn primary" style="min-width:0">Resume</div><div class="btn hover" style="min-width:0">${icon('gear')} Settings</div><div class="btn" style="min-width:0">Restart run</div><div class="btn" style="min-width:0">Quit to title</div></div>`);
  add(`<div class="card" style="right:${W * 0.06}px;top:${H * 0.08}px;width:${W * 0.45}px;bottom:${H * 0.08}px;padding:${12 * u}px ${24 * u}px">
    <div class="disp" style="font-size:${34 * u}px;text-decoration:underline wavy var(--red);text-underline-offset:${6 * u}px">Settings</div>
    ${G.settings.map((s) => `<div class="row"><span>${s.k}</span>${s.t === 'check' ? `<span class="cb ${s.v ? 'on' : ''}"></span>` : s.t === 'range' ? `<span class="track"><b style="left:${pct(Math.min(1, s.v / (s.k === 'Screen shake' ? 1.5 : 1)))}"></b></span>` : `<span style="border:${2 * u}px solid var(--ink);border-radius:var(--sk2);padding:${2 * u}px ${10 * u}px;font-size:${14 * u}px">${s.v} ▾</span>`}</div>`).join('')}</div>`);
}
function results() {
  const R = G.results;
  add(`<div style="position:absolute;inset:0;background:rgba(251,248,240,.8)"></div>`);
  add(`<div class="card tape" style="left:50%;transform:translateX(-50%) rotate(-.6deg);top:${H * 0.07}px;width:${Math.min(W * 0.66, 780 * u)}px;bottom:${H * 0.06}px;padding:${16 * u}px ${30 * u}px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="disp" style="font-size:${34 * u}px;text-decoration:underline wavy var(--red);text-underline-offset:${6 * u}px">Report card</div>
      <div class="disp" style="font-size:${64 * u}px;line-height:1">${R.score.toLocaleString()}</div><div class="lbl">best ${R.best.toLocaleString()} · wave ${R.wave}</div></div>
      <div style="border:${4 * u}px solid var(--red);border-radius:${8 * u}px;padding:${2 * u}px ${16 * u}px;transform:rotate(10deg);text-align:center;color:var(--red)"><div class="disp" style="font-size:${56 * u}px;line-height:1">${R.maxRank}</div><div class="lbl" style="color:var(--red)">style</div></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;column-gap:${30 * u}px;margin-top:${8 * u}px">${[['Best combo', R.bestCombo + ' hits'], ['K.O.s', R.kos], ['Perfect parries', R.parries], ['Finishers', R.finishers], ['Specials', R.specials], ['Rhythm', R.rhythm.accuracy + '% ' + R.rhythm.label.toLowerCase()], ['Best streak', R.rhythm.bestStreak], ['Wave reached', R.wave]].map(([k, v]) => `<div class="row"><span>${k}</span><span class="disp" style="font-size:${22 * u}px;color:var(--blue)">${v}</span></div>`).join('')}</div>
    <div style="display:flex;gap:${14 * u}px;justify-content:center;margin-top:${14 * u}px"><div class="btn primary">Fight again</div><div class="btn" style="min-width:${160 * u}px">Title</div></div></div>`);
}
function states() {
  add(`<div style="position:absolute;inset:0;background:#fbf8f0"></div>`);
  const L = (t, y) => add(`<div class="disp" style="position:absolute;left:${36 * u}px;top:${y}px;font-size:${20 * u}px;color:var(--pencil)">${t}</div>`);
  L('Buttons — default · hover · pressed · disabled · primary', 18 * u);
  add(`<div style="position:absolute;left:${36 * u}px;top:${56 * u}px;display:flex;gap:${16 * u}px">${['', 'hover', 'pressed', 'disabled', 'primary'].map((c) => `<div class="btn ${c}" style="min-width:${200 * u}px">${c ? c[0].toUpperCase() + c.slice(1) : 'Default'}</div>`).join('')}</div>`);
  L('Special bar — charging · ready · active', 140 * u);
  [['charging', 0.42], ['ready', 1], ['active', 1]].forEach(([s, f], i) => add(`<div class="card" style="left:${(36 + i * 400) * u}px;top:${180 * u}px;padding:${10 * u}px ${14 * u}px">${specialPill(s, f, 320)}</div>`));
  L('Laser heat · judgments · tier words', 280 * u);
  add(`<div class="card" style="left:${36 * u}px;top:${318 * u}px;padding:${8 * u}px ${12 * u}px;width:${220 * u}px"><div class="lbl" style="color:var(--ink)">${icon('laser')} heat</div><div class="pill" style="margin-top:${4 * u}px"><i class="hatch" style="width:${pct(G.heat)};--c:var(--red)"></i></div></div>`);
  ['perfect!', 'great!', 'good', 'miss'].forEach((j, i) => add(`<div class="disp" style="position:absolute;left:${(320 + i * 160) * u}px;top:${322 * u}px;font-size:${32 * u}px;transform:rotate(-4deg);color:${['var(--blue)', 'var(--mint)', 'var(--ink)', 'var(--red)'][i]}">${i === 0 ? `<span class="hl">${j}</span>` : j}</div>`));
  G.tiers.forEach((t, i) => add(`<div class="disp" style="position:absolute;left:${(70 + i * 380) * u}px;top:${410 * u}px;font-size:${(44 + i * 8) * u}px;transform:rotate(${-3 + i * 2}deg);color:${['var(--pencil)', 'var(--blue)', 'var(--red)'][i]}">${i === 2 ? `<span class="hl">${t.toLowerCase()}!</span>` : t.toLowerCase() + (i ? '!' : '…')}</div>`));
  L('Icon set', 520 * u);
  add(`<div style="position:absolute;left:${36 * u}px;top:${560 * u}px;display:flex;gap:${16 * u}px;flex-wrap:wrap;width:${W - 72 * u}px;font-size:${30 * u}px">${Object.keys(ICON).map((k) => icon(k)).join('')}</div>`);
}
({ gameplay: hud, trace: () => special(false), qte: () => special(true), title, loadout, pause, results, states })[SCREEN]?.();
</script></body></html>
